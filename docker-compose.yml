name: remotify

services:
  api:
    build: ./php
    restart: unless-stopped
    # Container config comes from the rendered .env itself, not from ${VAR}
    # interpolation: interpolation lets any same-named variable in the calling
    # shell (e.g. a CI project variable) silently override .env. Each key is
    # documented in .env.example.
    env_file: .env
    volumes:
      - ./data/sessions:/var/data/sessions
    networks: [internal]

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    env_file: .env
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on: [api]
    networks: [internal]

  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        : "$${CERTBOT_EMAIL:?CERTBOT_EMAIL required for tls profile}"
        STAGING=""
        [ "$$CERTBOT_STAGING" = "1" ] && STAGING="--staging"
        CERT="/etc/letsencrypt/live/$$DOMAIN/fullchain.pem"
        if [ -f "$$CERT" ]; then
          SUBJ=$$(openssl x509 -in "$$CERT" -noout -subject 2>/dev/null | sed 's/^subject= *//')
          ISSU=$$(openssl x509 -in "$$CERT" -noout -issuer  2>/dev/null | sed 's/^issuer= *//')
          if [ "$$SUBJ" = "$$ISSU" ]; then
            echo "remotify-certbot: replacing bootstrap self-signed cert"
            rm -rf /etc/letsencrypt/live/$$DOMAIN \
                   /etc/letsencrypt/archive/$$DOMAIN \
                   /etc/letsencrypt/renewal/$$DOMAIN.conf
          fi
        fi
        if [ ! -f "$$CERT" ]; then
          if ! certbot certonly --webroot -w /var/www/certbot \
            -d "$$DOMAIN" \
            --email "$$CERTBOT_EMAIL" \
            --agree-tos --no-eff-email --non-interactive \
            $$STAGING; then
            # Wait before the restart policy retries, or the ACME failed-validation limit trips within minutes.
            echo "remotify-certbot: issuance failed for $$DOMAIN; retrying in 10 minutes"
            sleep 600
            exit 1
          fi
        fi
        trap exit TERM
        while :; do
          sleep 12h & wait $${!}
          certbot renew --webroot -w /var/www/certbot --quiet
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [internal]

volumes:
  letsencrypt:
  certbot-www:

networks:
  internal:
    driver: bridge
